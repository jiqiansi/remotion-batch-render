name: Render Transitions

on:
  workflow_dispatch:
    inputs:
      composition:
        description: 'Composition ID to render'
        required: true
        default: 'Tunnel'
      width:
        description: 'Width'
        required: false
        default: '1920'
      height:
        description: 'Height'
        required: false
        default: '1080'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Render ${{ github.event.inputs.composition }}
        run: |
          npx remotion render ${{ github.event.inputs.composition }} \
            out/${{ github.event.inputs.composition }}.mp4 \
            --codec=h264 --concurrency=2 \
            --width=${{ github.event.inputs.width }} \
            --height=${{ github.event.inputs.height }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.composition }}
          path: out/${{ github.event.inputs.composition }}.mp4

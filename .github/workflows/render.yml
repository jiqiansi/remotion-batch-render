name: Render Transitions

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        composition: [Tunnel, Shatter, Vortex, LightLeak, Glitch, PaperFold, ParticleDissolve, WaveWarp, CubeFlip, SmokeRise]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Render ${{ matrix.composition }}
        run: |
          npx remotion render ${{ matrix.composition }} \
            out/${{ matrix.composition }}.mp4 \
            --codec=h264 --concurrency=2
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.composition }}
          path: out/${{ matrix.composition }}.mp4

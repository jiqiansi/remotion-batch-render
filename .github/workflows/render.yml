name: 术数精讲 · 21 期批量渲染

# 手动触发。本地 4 核渲 21 期要 7.5 小时；这里 21 个任务同时并行。
# 公开仓库的 Actions 免费额度 2000 分钟/月。
on:
  workflow_dispatch:
    inputs:
      from:
        description: '起始期号（1-21）'
        required: false
        default: '1'
      to:
        description: '结束期号（1-21）'
        required: false
        default: '21'
      conc:
        description: '浏览器并发数（ubuntu-latest 是 2 vCPU，填 2）'
        required: false
        default: '2'
      stride:
        description: '抽样步长（每 N 帧渲一帧再补；6 是本机实测值，填 1 = 全帧最保险但慢）'
        required: false
        default: '6'

jobs:
  # ⚠️ `matrix` 是**静态**的，`inputs.from` / `inputs.to` 不会过滤它
  #    （踩过：以为只跑第 1 期做冒烟测试，结果 21 个任务全起来了）。
  #    所以要一个 prepare 任务先把区间算成 JSON 数组，再喂给 matrix。
  prepare:
    runs-on: ubuntu-latest
    outputs:
      periods: ${{ steps.gen.outputs.periods }}
    steps:
      - id: gen
        run: |
          FROM=${{ inputs.from }}
          TO=${{ inputs.to }}
          FROM=${FROM:-1}; TO=${TO:-21}
          if [ "$FROM" -lt 1 ] || [ "$TO" -gt 21 ] || [ "$FROM" -gt "$TO" ]; then
            echo "❌ 区间不合法：$FROM..$TO（要在 1..21 内且 FROM<=TO）"; exit 1
          fi
          arr=$(seq "$FROM" "$TO" | sed 's/^/"/;s/$/"/' | paste -sd, -)
          echo "periods=[$arr]" >> "$GITHUB_OUTPUT"
          echo "将渲染第 $FROM..$TO 期（$(seq "$FROM" "$TO" | wc -l) 个任务）"

  render:
    needs: prepare
    name: 第 ${{ matrix.period }} 期
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false            # 一期失败不影响其他期
      max-parallel: 21
      matrix:
        period: ${{ fromJSON(needs.prepare.outputs.periods) }}

    steps:
      # ⚠️ **必须补零**。matrix 里 `period` 是数字，`${{ matrix.period }}` 会插值成
      #    `1` 而不是 `01`，而目录/资源名是 `qianfa-l01`（个位数期号全失败，
      #    10-21 正常——2026-10-05 踩过）。这里统一用 printf 补零。
      - name: 定位期号目录
        id: meta
        run: echo "dir=qianfa-l$(printf '%02d' ${{ matrix.period }})" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - name: 装依赖
        working-directory: ${{ steps.meta.outputs.dir }}
        run: |
          node -v && npm -v
          npm ci --no-audit --no-fund

      - name: 装渲染依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-numpy
          for b in google-chrome-stable google-chrome chromium chromium-browser; do
            p=$(command -v "$b" || true)
            if [ -n "$p" ]; then echo "REMOTION_BROWSER_EXECUTABLE=$p" >> "$GITHUB_ENV"; echo "用 $p"; break; fi
          done

      - name: 校验资产（早失败早看到原因）
        env:
          DIR: ${{ steps.meta.outputs.dir }}
          P: ${{ matrix.period }}
        run: |
          SLUG="qianfa-l$(printf '%02d' "$P")"
          echo "期号 $P → 目录 $DIR / slug $SLUG"
          test -d "$DIR" || { echo "❌ 缺目录 $DIR"; exit 1; }
          test -f "$DIR/src/qianfa/spec.ts"     || { echo "❌ 缺 spec.ts"; exit 1; }
          test -f "$DIR/src/common/timeline.ts" || { echo "❌ 缺 timeline.ts"; exit 1; }
          test -f "$DIR/public/assets/$SLUG/audio.mp3" || { echo "❌ 缺音频"; exit 1; }
          # 字体是指向 shared/fonts 的符号链接，确认能解析到真实文件
          ls "$DIR/public/fonts/LXGWWenKai-Regular.ttf" >/dev/null || { echo "❌ 字体链接断了"; exit 1; }
          grep -oE 'TOTAL_FRAMES = [0-9]+' "$DIR/src/common/timeline.ts" | head -1
          echo "✅ 资产齐了"

      - name: 渲染
        working-directory: ${{ steps.meta.outputs.dir }}
        env:
          # 仓库里放的是 64kbps 单声道 MP3。原始 WAV 每期 91.8MB、21 期 1.9GB，
          # 而最终编码本来就是 `-c:a aac -b:a 160k` 重编码，源精度才是上限。
          AUDIO_EXT: mp3
          # swiftshader = 软件 OpenGL。GitHub runner 无 GPU，
          # **别改成 angle/vulkan**：无头容器里会悄悄退回软件渲染，反而更慢。
          REMOTION_GL: swiftshader
          RENDER_ROOT: ${{ runner.temp }}/render
          RENDER_OUT: ${{ github.workspace }}/out
          VIDEO_OUT: ${{ github.workspace }}/out/qianfa-l${{ steps.meta.outputs.dir }}.mp4
          CONC: ${{ inputs.conc }}
          STRIDE: ${{ inputs.stride }}
          KEEP_SEQ: '0'          # 渲完删中间帧，否则 runner 磁盘会满
          MAX_LOAD: '99'         # 别被 load 检查挡住
          MIN_FREE_MB: '2048'
        run: |
          bash scripts/render_fast.sh
          ls -lh "$VIDEO_OUT"

      - name: 上传成片
        uses: actions/upload-artifact@v4
        with:
          name: video-period-${{ matrix.period }}
          path: out/qianfa-l${{ steps.meta.outputs.dir }}.mp4
          retention-days: 7
          if-no-files-found: error
